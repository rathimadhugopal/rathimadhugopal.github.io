name: Morning board

on:
  schedule:
    - cron: "45 2 * * 1-5"     # 08:15 IST, Monday to Friday (GitHub cron is UTC)
  workflow_dispatch:           # "Run workflow" button for a manual refresh any time

permissions:
  contents: write

concurrency:
  group: morning-board
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - name: Build the page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python build_board.py
      - name: Publish
        run: |
          git config user.name "morning-board"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Board for $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M')"
          git push
