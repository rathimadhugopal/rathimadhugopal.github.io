name: Morning board

on:
  schedule:
    - cron: "45 2 * * 1-5"     # 08:15 IST: overnight news (GitHub cron is UTC)
    - cron: "35 3 * * 1-5"     # 09:05 IST: starts early, then waits for NSE pre-open (published 09:08)
    - cron: "*/15 4-9 * * 1-5" # every 15 min, 09:30-15:15 IST: keeps the page fresh through the session
    - cron: "0,15,30 10 * * 1-5" # 15:30, 15:45, 16:00 IST: closing prices
  push:
    branches: [main]           # every push rebuilds the page
  workflow_dispatch:           # "Run workflow" button for a manual refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - name: Build the page
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REFRESH_URL: https://github.com/${{ github.repository }}/actions/workflows/morning-board.yml
        run: python build_board.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
